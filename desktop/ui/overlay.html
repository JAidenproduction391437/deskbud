<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>Desk Bud overlay</title>
  <link rel="stylesheet" href="overlay.css">
  <script src="overlay.js" defer></script>
</head>
<body>
  <div id="viewing" hidden>Your phone is viewing this screen</div>

  <div id="buddy">
    <p id="bubble" hidden></p>
    <svg id="buddy-face" viewBox="0 0 120 100" aria-hidden="true">
      <rect class="body" x="4" y="4" width="112" height="92" rx="42"/>
      <g class="eye">
        <ellipse class="white" cx="41" cy="44" rx="15" ry="17"/>
        <circle class="pupil" cx="41" cy="44" r="8"/>
      </g>
      <g class="eye">
        <ellipse class="white" cx="79" cy="44" rx="15" ry="17"/>
        <circle class="pupil" cx="79" cy="44" r="8"/>
      </g>
      <path class="mouth" d="M52 72 Q60 80 68 72"/>
    </svg>
  </div>

  <div id="blue-mouse">
    <span class="ripple"></span>
    <svg viewBox="0 0 60 66" aria-hidden="true">
      <path class="arrow" d="M5 6 C4 2 8 0 11 2 L54 32 C58 35 56 40 52 40 L34 41 C32 41 31 42 30 43 L19 58 C17 61 12 60 12 56 Z"/>
      <circle class="dot" cx="20" cy="27" r="5"/>
      <circle class="dot" cx="33" cy="33" r="5"/>
      <circle class="spark" cx="21.5" cy="25.5" r="1.7"/>
      <circle class="spark" cx="34.5" cy="31.5" r="1.7"/>
      <path class="smile" d="M21 38 Q24 42 28 40"/>
    </svg>
  </div>
</body>
</html>
